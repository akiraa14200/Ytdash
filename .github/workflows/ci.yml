name: Ytdash CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          YOUTUBE_CLIENT_ID: ci-placeholder
          YOUTUBE_CLIENT_SECRET: ci-placeholder
          YOUTUBE_REDIRECT_URI: http://localhost:3000/api/youtube/callback
          YOUTUBE_TOKEN_ENCRYPTION_KEY: Y2lwaWNpcGljaXBpY2lwaWNpcGljaXBpY2lwaWNpcGljaXBpY2k=
          APP_URL: http://localhost:3000
